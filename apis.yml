aid: devai
name: DevAI
description: >-
  DevAI (DevAI Solutions, Inc.) is a Silicon Valley enterprise IT company, founded in 2024 by
  Susie Wee (CEO) and Edwin Zhang, that builds agentic AI for IT operations teams. Its DevAI Network
  Intelligence Engine reconciles data across fragmented IT tools of record (CMDB, vCenter, NetBox and
  other infrastructure, network, compute, and security systems) into a single trustworthy operational
  view, and its Network Intelligence Agent "Neo" streamlines IT planning, incident response, patch
  management, and security and compliance workflows through a chat interface. DevAI reports deployment
  at Fortune 50 enterprises and won Best-in-Show (Automation) at the AI Networking Summit 2025. The
  company raised a $6M seed round led by Emergence Capital with Pear VC, Base10 Partners, and
  Benchstrength. No public developer API, OpenAPI, SDK, or developer portal has been published to date;
  this profile captures the company identity and the security posture of its public web surface.
